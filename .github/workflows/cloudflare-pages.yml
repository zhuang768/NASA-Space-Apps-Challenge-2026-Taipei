name: Deploy TerraMatch Mission Lab to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Fail before building if deployment cannot run. Never report a skipped
      # upload as a successful deployment, and never print credential values.
      - name: Validate deployment configuration
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = (process.env.RAW_CF_TOKEN || '').trim();
          const account = (process.env.RAW_CF_ACCOUNT || '').trim();
          const errors = [];
          if (!token || /\s|[^\x21-\x7e]/.test(token)) {
            errors.push('Replace CLOUDFLARE_API_TOKEN with the API token value only (no command, quotes, internal whitespace or invisible characters).');
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) {
            errors.push('Set CLOUDFLARE_ACCOUNT_ID to the 32-character account ID of the existing Pages project.');
          }
          if (errors.length) {
            errors.forEach(message => console.error('::error::' + message));
            process.exit(1);
          }
          process.stdout.write('::add-mask::' + token + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'CF_API_TOKEN_CLEAN=' + token + '\nCF_ACCOUNT_CLEAN=' + account + '\n');
          NODE

      - name: Build workbench data
        run: python3 web/scripts/build_workbench_data.py

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stamp release identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('web/dist/deployment.json', JSON.stringify({commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID}) + '\n');
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN_CLEAN }}
          accountId: ${{ env.CF_ACCOUNT_CLEAN }}
          wranglerVersion: "4.162.0"
          command: >-
            pages deploy web/dist
            --project-name=terramatch-mission-lab
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Verify public release matches this commit
        env:
          SITE_URL: https://terramatch-mission-lab.pages.dev
        run: python3 scripts/verify_public_release.py
