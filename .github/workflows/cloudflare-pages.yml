name: Deploy TerraMatch Mission Lab to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "outputs/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Deploy step is skipped (build still runs) until the repo owner adds the secrets.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Rebuild the data bundle from the committed outputs/ (stdlib only, no venv needed).
      - name: Build workbench data
        run: python3 web/scripts/build_workbench_data.py

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Skip deploy (Cloudflare secrets not configured)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set; build verified, deploy skipped."

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: >-
            pages deploy web/dist
            --project-name=terramatch-mission-lab
            --branch=main
            --commit-hash=${{ github.sha }}
