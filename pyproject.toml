[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-analog"
version = "0.1.0"
description = "Find Earth analogs for Mars sites (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray",
    "rasterio",
    "matplotlib",
    "requests",
    "earthaccess",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["analog"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
